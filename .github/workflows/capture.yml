name: Capture WSR

on:
  schedule:
    - cron: "*/15 * * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-wsr
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Load saved data (data branch)
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C data
          else
            echo "No data branch yet; this is the first capture."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Capture latest WSR
        env:
          WSR_URL: ${{ secrets.WSR_URL }}
          DATA_DIR: data
        run: python capture.py

      - name: Save data (data branch)
        run: |
          cd data
          if [ ! -f .changed ]; then echo "No new pull; nothing to save."; exit 0; fi
          rm .changed
          git init -q -b data
          git config user.name "wsr-capture"
          git config user.email "wsr-capture@users.noreply.github.com"
          git add -A
          git commit -q -m "Capture $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:data
